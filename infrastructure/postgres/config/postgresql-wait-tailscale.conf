# systemd drop-in for the PostgreSQL cluster unit on SOC-DATABASE (VM 2)
# Install to: /etc/systemd/system/postgresql@.service.d/10-wait-tailscale.conf
#   sudo systemctl daemon-reload
#
# listen_addresses includes the Tailscale IP. If PostgreSQL starts at boot
# before tailscaled has assigned that IP, it only binds localhost, and VM 3
# and VM 4 can't connect until someone restarts it. This waits up to 30 s
# for tailscale0 to have an IPv4 address, then starts PostgreSQL anyway.
[Unit]
After=tailscaled.service network-online.target
Wants=network-online.target

[Service]
ExecStartPre=/bin/sh -c 'n=0; while [ $$n -lt 30 ]; do ip -4 -o addr show dev tailscale0 2>/dev/null | grep -q inet && exit 0; n=$$((n+1)); sleep 1; done; echo "tailscale0 has no IPv4 after 30s, starting PostgreSQL anyway" >&2; exit 0'
