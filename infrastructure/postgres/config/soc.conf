# =====================================================================
# SOC-DATABASE (VM 2): PostgreSQL drop-in for the SOC lab
# =====================================================================
# Install to: /etc/postgresql/<PG_VERSION>/main/conf.d/soc.conf
# Ubuntu's postgresql.conf already has  include_dir = 'conf.d'
# Replace <VM2_TS_IP> with SOC-DATABASE's Tailscale IP (tailscale ip -4).
# listen_addresses, logging_collector and shared_preload_libraries need a
# restart:  sudo systemctl restart postgresql
# Everything else applies with a reload.
# =====================================================================

# ---------------------------------------------------------------------
# Network: localhost (agent, admin, tests) and the Tailscale interface
# only. Never 0.0.0.0. pg_hba.conf and ufw restrict who can actually
# connect over Tailscale (VM 3 and VM 4 only).
# WARNING: postgresql.auto.conf (ALTER SYSTEM) is read AFTER conf.d and
# wins. Clear any old value first:
#   sudo -u postgres psql -c 'ALTER SYSTEM RESET listen_addresses;'
# ---------------------------------------------------------------------
listen_addresses = 'localhost,<VM2_TS_IP>'
port = 5432
max_connections = 100
password_encryption = scram-sha-256

# Drop dead TCP clients after about 2 minutes instead of 2 hours
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# ---------------------------------------------------------------------
# Logging: one JSON object per line, read by the SOC agent
# ---------------------------------------------------------------------
logging_collector = on
log_destination = 'jsonlog'
# The directory must exist, owned postgres:adm with mode 2750 (see the
# setup doc). The setgid bit keeps new log files in the adm group, which
# the soc-agent service user belongs to.
log_directory = '/var/log/postgresql/soc'
# jsonlog swaps .log for .json, so files are named soc-YYYY-MM-DD.json
log_filename = 'soc-%Y-%m-%d.log'
log_file_mode = 0640
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = off
log_timezone = 'UTC'

# Who connects and disconnects. On PostgreSQL 18+ 'on' still means
# receipt,authentication,authorization.
log_connections = on
log_disconnections = on
log_hostname = off

# CREATE / ALTER / DROP statements. Password-setting scripts turn this
# off for their own session (see sql/roles.sql).
log_statement = 'ddl'

# Slow queries: anything over 500 ms is logged with its duration
log_min_duration_statement = 500
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 10s

# Log the statement that caused each ERROR, such as permission denied
log_min_messages = warning
log_min_error_statement = error
log_error_verbosity = default

# Kept for anyone who switches log_destination back to stderr
log_line_prefix = '%m [%p] %q%u@%d from %h app=%a '

# ---------------------------------------------------------------------
# Statistics for the soc_monitor role
# ---------------------------------------------------------------------
track_activities = on
track_counts = on
track_io_timing = on
track_activity_query_size = 2048

# pg_stat_statements ships with Ubuntu's postgresql package. If you
# enable pgaudit later, soc_pgaudit.conf (loaded after this file)
# overrides this line.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.max = 5000
