# =====================================================================
# SOC-DATABASE (VM 2): OPTIONAL pgaudit drop-in
# =====================================================================
# Only install this after:
#   sudo apt install postgresql-<PG_VERSION>-pgaudit
# Install to: /etc/postgresql/<PG_VERSION>/main/conf.d/soc_pgaudit.conf
# Name it soc_pgaudit.conf: '_' sorts after '.', so this file loads after
# soc.conf and its shared_preload_libraries wins. Then:
#   sudo systemctl restart postgresql
#   sudo -u postgres psql -d techstore -c 'CREATE EXTENSION IF NOT EXISTS pgaudit;'
# =====================================================================

shared_preload_libraries = 'pg_stat_statements,pgaudit'

# Audit schema changes and role/grant changes for everyone
pgaudit.log = 'ddl, role'
pgaudit.log_catalog = off
pgaudit.log_relation = on
pgaudit.log_parameter = off

# Object auditing: every read of a table that the role "auditor" has
# SELECT on is logged. Only employees is audited, so any read of
# salaries or SSNs leaves an AUDIT: line, even when it succeeds:
#   CREATE ROLE auditor NOLOGIN;
#   GRANT SELECT ON employees TO auditor;
pgaudit.role = 'auditor'
